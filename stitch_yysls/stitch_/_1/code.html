<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Cinematic Background Effects */
        .cinematic-overlay {
            background: radial-gradient(circle at 50% 40%, transparent 10%, #0d0e0f 85%);
        }

        .ink-smoke {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.3;
            mix-blend-mode: screen;
        }

        /* Spotlight Animation */
        @keyframes god-rays {
            0%, 100% { opacity: 0.4; transform: rotate(-5deg) scale(1.1); }
            50% { opacity: 0.7; transform: rotate(5deg) scale(1.2); }
        }

        .god-ray {
            position: absolute;
            top: -20%;
            left: 50%;
            width: 200vw;
            height: 200vh;
            background: conic-gradient(from 180deg at 50% 0%, transparent 45%, rgba(233, 193, 118, 0.08) 50%, transparent 55%);
            transform-origin: top center;
            animation: god-rays 12s ease-in-out infinite;
            filter: blur(40px);
            pointer-events: none;
        }

        /* Particle effects */
        .particle {
            position: absolute;
            background: #dab36a;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: rise 10s infinite linear;
        }

        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Button Hover Glow */
        .gold-btn-shadow:hover {
            box-shadow: 0 0 25px rgba(233, 193, 118, 0.4), inset 0 0 10px rgba(233, 193, 118, 0.2);
        }

        /* Traditional Divider Fade */
        .divider-fade {
            height: 1px;
            background: linear-gradient(90deg, transparent, #dab36a 50%, transparent);
        }
    </style>
