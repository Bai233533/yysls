<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_13 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_13" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_13');
  const devicePixelRatio = window.devicePixelRatio || 1;
  /**
 * Three.js Card Detail Interaction
 * Features:
 * - 3D Card rotation tracking mouse
 * - Dynamic sheen/glossing effect
 * - Responsive sizing
 */

const scene = new THREE.Scene();
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 1.2);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Card Geometry
const geometry = new THREE.PlaneGeometry(3, 4.2, 32, 32);

// Custom Shader Material for Gloss/Sheen Effect
const cardMaterial = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: {
    u_time: { value: 0 },
    u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
    u_texture: { value: null } // To be set if needed, or use a procedural background
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vViewPosition;

    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vViewPosition = -mvPosition.xyz;
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vViewPosition;
    uniform float u_time;
    uniform vec2 u_mouse;

    void main() {
      // Base Color: Wuxia Noir Dark
      vec3 baseColor = vec3(0.05, 0.05, 0.06); 
      
      // Gloss / Sheen Logic
      vec3 normal = normalize(vNormal);
      vec3 viewDir = normalize(vViewPosition);
      
      // Mouse-based highlight position
      vec2 lightPos = u_mouse;
      float dist = distance(vUv, lightPos);
      float sheen = smoothstep(0.4, 0.0, dist) * 0.4;
      
      // Dynamic diagonal sweep shimmer
      float sweep = sin(vUv.x * 2.0 + vUv.y * 2.0 + u_time * 2.0) * 0.5 + 0.5;
      sheen += pow(sweep, 10.0) * 0.15;

      // Rim light
      float rim = 1.0 - max(dot(viewDir, normal), 0.0);
      rim = pow(rim, 3.0);
      
      vec3 finalColor = baseColor + vec3(sheen) + vec3(rim * 0.2);
      
      // Add a subtle border glow
      float border = smoothstep(0.48, 0.5, max(abs(vUv.x - 0.5), abs(vUv.y - 0.5)));
      finalColor += border * vec3(0.8, 0.7, 0.4) * 0.5;

      gl_FragColor = vec4(finalColor, 0.98);
    }
  `
});

const card = new THREE.Mesh(geometry, cardMaterial);
scene.add(card);

// Mouse Interaction State
const mouse = new THREE.Vector2();
const targetRotation = new THREE.Vector2();

function onMouseMove(event) {
  const rect = container.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  
  // Set rotation targets (max 15 degrees)
  targetRotation.y = mouse.x * 0.25;
  targetRotation.x = -mouse.y * 0.25;
  
  // Update shader uniform for gloss positioning (normalized 0-1)
  cardMaterial.uniforms.u_mouse.value.x = (mouse.x + 1) / 2;
  cardMaterial.uniforms.u_mouse.value.y = (mouse.y + 1) / 2;
}

window.addEventListener('mousemove', onMouseMove);

function animate(time) {
  requestAnimationFrame(animate);
  
  // Smoothly interpolate rotation
  card.rotation.x += (targetRotation.x - card.rotation.x) * 0.1;
  card.rotation.y += (targetRotation.y - card.rotation.y) * 0.1;
  
  cardMaterial.uniforms.u_time.value = time * 0.001;
  
  renderer.render(scene, camera);
}

function handleResize() {
  const newWidth = container.clientWidth || window.innerWidth;
  const newHeight = container.clientHeight || window.innerHeight;
  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(newWidth, newHeight);
}

window.addEventListener('resize', handleResize);
animate(0);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_13 -->
</body>
</html>
