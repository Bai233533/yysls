<script>
    // Micro-interaction for the scrolling gallery
    const scrollContainer = document.getElementById('memberList');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');

    if(nextBtn && scrollContainer) {
        nextBtn.addEventListener('click', () => {
            scrollContainer.scrollBy({ left: 300, behavior: 'smooth' });
        });
        prevBtn.addEventListener('click', () => {
            scrollContainer.scrollBy({ left: -300, behavior: 'smooth' });
        });
    }

    // Parallax interaction for immersive depth
    window.addEventListener('mousemove', (e) => {
        const bg = document.querySelector('.bg-cover');
        const x = (window.innerWidth / 2 - e.pageX) / 60;
        const y = (window.innerHeight / 2 - e.pageY) / 60;
        if(bg) bg.style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
    });
</script>
